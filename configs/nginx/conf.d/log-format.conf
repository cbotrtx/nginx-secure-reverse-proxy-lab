# Security-focused access log for the Day 2 lab
log_format lab_security '$remote_addr user=$remote_user [$time_iso8601] '
                        'host=$host "$request" status=$status bytes=$body_bytes_sent '
                        'rt=$request_time up=$upstream_addr up_status=$upstream_status '
                        'up_rt=$upstream_response_time tls=$ssl_protocol/$ssl_cipher '
                        '"$http_user_agent"';
