# app2 /admin/: must come from localhost AND log in
location /admin/ {
    satisfy all;

    allow 127.0.0.1;
    allow ::1;
    deny  all;

    auth_basic           "Lab admin";
    auth_basic_user_file /etc/nginx/.htpasswd-lab;

    include snippets/proxy-headers.conf;
    proxy_pass http://app2_backend;
}
